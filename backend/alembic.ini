# Alembic config for MedRec. The database URL always comes from
# backend/.env (via app.core.config) — this file only holds defaults.
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# Empty on purpose: env.py fills it from backend/.env (settings.DATABASE_URL),
# or from the live engine URL when migrations run via app startup.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
