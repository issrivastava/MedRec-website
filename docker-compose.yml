services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: medrec
      POSTGRES_PASSWORD: medrec
      POSTGRES_DB: medrec
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    image: issrivastava/medrec-backend:1.0
    environment:
      DATABASE_URL: postgresql+psycopg2://medrec:medrec@db:5432/medrec
      # Required: generate with `python -c "import secrets; print(secrets.token_hex(32))"`
      # and export before `docker compose up`, e.g. `$env:SECRET_KEY='<value>'`
      # (PowerShell) or `SECRET_KEY=<value> docker compose up` (bash).
      # Compose fails fast with a clear message if it is missing.
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY env var before running docker compose}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.1:8b
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174
      UPLOAD_DIR: /data/uploads
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      - db
      - ollama

  frontend:
    image: issrivastava/medrec-frontend:1.0 
    ports:
      - "5173:80"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    # After first start, run: docker exec -it <ollama-container> ollama pull llama3.1:8b

volumes:
  pgdata:
  uploads:
  ollama:
